[project]
name = "pss-ml"
version = "0.1.0"
description = "PSS-AI Phase 1 behaviour models: focus fingerprint, churn, anomaly flags, cash-flow forecast"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "lifelines>=0.29",
  "pyarrow>=16",
]

[project.scripts]
pss-ml = "pss_ml.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pss_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
